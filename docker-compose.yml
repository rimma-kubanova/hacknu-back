version: '3.8'
services:
  backend:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/code
    environment:
      - DATABASE_URL=sqlite:///./app.db
      - SECRET_KEY=${SECRET_KEY:-jwt-key-change-in-production}
      - HIGGSFIELD_API_KEY=${HIGGSFIELD_API_KEY}
      - HIGGSFIELD_API_SECRET=${HIGGSFIELD_API_SECRET}
      - HIGGSFIELD_BASE_URL=https://platform.higgsfield.ai/v1
    env_file:
      - .env